<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seguridad - Recogida de Menores</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.3.0/exceljs.min.js"></script>
    <style>
        .signature-pad { border: 2px dashed #cbd5e1; cursor: crosshair; touch-action: none; }
        .modal { transition: all 0.3s ease; }
        body.modal-active { overflow: hidden; }
        .input-field { @apply w-full px-4 py-3 rounded-sm bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white transition-all outline-none; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen p-4 md:p-10 font-sans text-slate-700">
    <div class="max-w-6xl mx-auto">
        <header class="flex flex-col md:flex-row md:items-center justify-between gap-6 mb-8 bg-white p-6 rounded-sm shadow-sm border border-slate-200">
            <div>
                <h1 class="text-2xl font-extrabold text-slate-900 tracking-tight">Registro de Recogida de Menores</h1>
                <p class="text-slate-500 text-sm">Panel de control de seguridad y trazabilidad.</p>
            </div>
            <div class="flex gap-3">
                <button onclick="toggleModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-sm font-bold transition-all shadow-lg shadow-indigo-200 flex items-center gap-2">
                    <span>+ Nueva Recogida</span>
                </button>
                <button onclick="exportToExcel()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-3 rounded-sm font-bold transition-all shadow-lg shadow-emerald-200 flex items-center gap-2">
                    <span>Exportar Excel</span>
                </button>
            </div>
        </header>

        <div class="bg-white rounded-sm shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-50 border-b border-slate-100">
                        <tr>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Fecha / Hora</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Menor</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider">Recoge / DNI</th>
                            <th class="px-6 py-4 text-xs font-bold text-slate-400 uppercase tracking-wider text-center">Firma</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal" class="modal opacity-0 pointer-events-none fixed inset-0 flex items-center justify-center z-50 p-4">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm" onclick="toggleModal()"></div>
        
        <div class="bg-white w-full max-w-2xl rounded-sm shadow-2xl z-50 overflow-hidden">
            <div class="p-8">
                <div class="flex justify-between items-center mb-8">
                    <h3 class="text-2xl font-bold text-slate-800">Formulario de Entrega</h3>
                    <button onclick="toggleModal()" class="text-slate-400 hover:text-slate-600 transition-colors text-2xl font-light">✕</button>
                </div>

                <form id="deliveryForm" class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">A quién recoge (Menor)</label>
                        <input type="text" id="minor" required placeholder="Nombre completo del menor" class="w-full px-4 py-3 rounded-sm bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white transition-all outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Persona que recoge</label>
                        <input type="text" id="adult" required placeholder="Nombre y apellidos" class="w-full px-4 py-3 rounded-sm bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white transition-all outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">DNI / Documento</label>
                        <input type="text" id="dni" required placeholder="Número de identidad" class="w-full px-4 py-3 rounded-sm bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white transition-all outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Fecha</label>
                        <input type="date" id="date" required class="w-full px-4 py-3 rounded-sm bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white transition-all outline-none">
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase mb-1 ml-1">Hora</label>
                        <input type="time" id="time" required class="w-full px-4 py-3 rounded-sm bg-slate-50 border-2 border-transparent focus:border-indigo-500 focus:bg-white transition-all outline-none">
                    </div>

                    <div class="md:col-span-2">
                        <div class="flex justify-between items-end mb-2">
                            <label class="text-xs font-bold text-slate-400 uppercase ml-1">Firma de Conformidad</label>
                            <button type="button" id="clearBtn" class="text-xs text-rose-500 font-bold hover:underline">Limpiar Firma</button>
                        </div>
                        <canvas id="signatureCanvas" class="signature-pad w-full h-40 bg-slate-50 rounded-sm"></canvas>
                    </div>

                    <button type="submit" class="md:col-span-2 mt-4 bg-indigo-600 text-white font-bold py-4 rounded-sm hover:bg-indigo-700 transition-all shadow-lg shadow-indigo-100">
                        Finalizar y Registrar
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        // DB Init
        let db;
        const request = indexedDB.open("SeguridadMenoresDB", 1);
        request.onupgradeneeded = (e) => {
            db = e.target.result;
            db.createObjectStore("entregas", { keyPath: "id", autoIncrement: true });
        };
        request.onsuccess = (e) => { db = e.target.result; loadTable(); };

        // Signature Logic
        const canvas = document.getElementById('signatureCanvas');
        const ctx = canvas.getContext('2d');
        let writing = false;

        function setupCanvas() {
            const rect = canvas.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.strokeStyle = "#1e293b"; ctx.lineWidth = 3; ctx.lineCap = "round";
        }

        const getPos = (e) => {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.clientX || (e.touches && e.touches[0].clientX);
            const clientY = e.clientY || (e.touches && e.touches[0].clientY);
            return { x: clientX - rect.left, y: clientY - rect.top };
        };

        const startDraw = (e) => { writing = true; ctx.beginPath(); const p = getPos(e); ctx.moveTo(p.x, p.y); };
        const draw = (e) => { if(!writing) return; const p = getPos(e); ctx.lineTo(p.x, p.y); ctx.stroke(); };
        const endDraw = () => writing = false;

        canvas.addEventListener('mousedown', startDraw);
        canvas.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', endDraw);
        canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDraw(e); });
        canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); });

        document.getElementById('clearBtn').onclick = () => ctx.clearRect(0, 0, canvas.width, canvas.height);

        // UI Logic
        function toggleModal() {
            const modal = document.getElementById('modal');
            modal.classList.toggle('opacity-0');
            modal.classList.toggle('pointer-events-none');
            document.body.classList.toggle('modal-active');
            
            if(!modal.classList.contains('opacity-0')) {
                const now = new Date();
                document.getElementById('date').valueAsDate = now;
                document.getElementById('time').value = now.toLocaleTimeString('en-GB', {hour: '2-digit', minute:'2-digit'});
                setTimeout(setupCanvas, 50);
            }
        }

        async function loadTable() {
            const transaction = db.transaction(["entregas"], "readonly");
            const data = transaction.objectStore("entregas").getAll();

            data.onsuccess = () => {
                const tbody = document.getElementById('tableBody');
                tbody.innerHTML = data.result.reverse().map(reg => `
                    <tr class="hover:bg-slate-50/80 transition-all">
                        <td class="px-6 py-4">
                            <div class="text-sm font-bold text-slate-800">${reg.fecha}</div>
                            <div class="text-xs text-slate-400 font-medium">${reg.hora}</div>
                        </td>
                        <td class="px-6 py-4 font-bold text-indigo-600">${reg.menor}</td>
                        <td class="px-6 py-4">
                            <div class="text-sm font-semibold text-slate-800">${reg.adulto}</div>
                            <div class="text-xs text-slate-400">${reg.dni}</div>
                        </td>
                        <td class="px-6 py-4 text-center">
                            <img src="${reg.firma}" class="h-10 mx-auto bg-white rounded border border-slate-100 p-1">
                        </td>
                    </tr>
                `).join('');
            };
        }

        document.getElementById('deliveryForm').onsubmit = (e) => {
            e.preventDefault();
            const record = {
                menor: document.getElementById('minor').value,
                adulto: document.getElementById('adult').value,
                dni: document.getElementById('dni').value,
                fecha: document.getElementById('date').value,
                hora: document.getElementById('time').value,
                firma: canvas.toDataURL()
            };

            const tx = db.transaction(["entregas"], "readwrite");
            tx.objectStore("entregas").add(record);
            tx.oncomplete = () => {
                loadTable();
                toggleModal();
                e.target.reset();
            };
        };

        // Advanced Excel Export with Images
        async function exportToExcel() {
            const workbook = new ExcelJS.Workbook();
            const sheet = workbook.addWorksheet('Recogidas');

            sheet.columns = [
                { header: 'Fecha', key: 'fecha', width: 15 },
                { header: 'Hora', key: 'hora', width: 10 },
                { header: 'Menor', key: 'menor', width: 25 },
                { header: 'Recoge', key: 'adulto', width: 25 },
                { header: 'DNI', key: 'dni', width: 15 },
                { header: 'Firma Responsable', key: 'firma', width: 30 }
            ];

            const transaction = db.transaction(["entregas"], "readonly");
            const registros = await new Promise(res => {
                transaction.objectStore("entregas").getAll().onsuccess = (e) => res(e.target.result);
            });

            for (let i = 0; i < registros.length; i++) {
                const r = registros[i];
                const rowNumber = i + 2;
                sheet.addRow(r);

                const imageId = workbook.addImage({
                    base64: r.firma,
                    extension: 'png'
                });

                sheet.addImage(imageId, {
                    tl: { col: 5, row: rowNumber - 1 },
                    ext: { width: 120, height: 45 }
                });
                sheet.getRow(rowNumber).height = 40;
            }

            const buffer = await workbook.xlsx.writeBuffer();
            const blob = new Blob([buffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `Registro_Recogidas_${new Date().toLocaleDateString()}.xlsx`;
            link.click();
        }
    </script>
</body>
</html>
